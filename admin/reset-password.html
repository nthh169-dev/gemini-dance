<!doctype html>
<html lang="vi">
<head>
<title>Đặt mật khẩu mới – Gemini Dance Admin</title>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../assets/img/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-root="../" data-no-track>
<main class="login-wrap">
  <div class="form-card login-card">
    <a href="../index.html"><img src="../assets/img/logo-lockup.svg" alt="Gemini Dance"></a>
    <h1 style="font-size:1.5rem;text-align:center">Đặt mật khẩu mới</h1>
    <div id="msg"><p class="muted" style="text-align:center">Đang kiểm tra link…</p></div>
    <form id="reset-form" style="display:grid;gap:14px" hidden>
      <div><label for="pw1">Mật khẩu mới (ít nhất 8 ký tự)</label><input id="pw1" type="password" required minlength="8" autocomplete="new-password"></div>
      <div><label for="pw2">Nhập lại mật khẩu mới</label><input id="pw2" type="password" required minlength="8" autocomplete="new-password"></div>
      <label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="show" style="width:auto"> Hiện mật khẩu</label>
      <button class="btn btn-primary" type="submit">Lưu mật khẩu mới</button>
    </form>
    <p style="text-align:center;margin-top:18px"><a href="login.html">← Quay lại đăng nhập</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(async function () {
  const msg = document.getElementById("msg"), form = document.getElementById("reset-form");
  if (!sb) { msg.innerHTML = `<div class="notice">Chưa cấu hình Supabase.</div>`; return; }
  const showForm = () => { msg.innerHTML = ""; form.hidden = false; };

  // Link lỗi / hết hạn: Supabase trả về #error=...&error_description=...
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("error") || qs("error")) {
    msg.innerHTML = `<div class="notice">Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. <a href="forgot-password.html">Gửi lại link mới</a></div>`;
    return;
  }
  // Supabase tự đọc token trong link email và tạo phiên tạm (sự kiện PASSWORD_RECOVERY)
  sb.auth.onAuthStateChange((event, session) => { if (event === "PASSWORD_RECOVERY" || session) showForm(); });
  const { data: { session } } = await sb.auth.getSession();
  if (session) showForm();
  else setTimeout(() => {
    if (form.hidden) msg.innerHTML = `<div class="notice">Không tìm thấy phiên đặt lại mật khẩu. Hãy mở trang này từ link trong email, hoặc <a href="forgot-password.html">gửi lại link</a>.</div>`;
  }, 2500);

  document.getElementById("show").onchange = (e) => ["pw1", "pw2"].forEach((id) => (document.getElementById(id).type = e.target.checked ? "text" : "password"));
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = document.getElementById("pw1").value, p2 = document.getElementById("pw2").value;
    if (p1 !== p2) { toast("Hai mật khẩu không khớp.", "err"); return; }
    const btn = form.querySelector("button"); btn.disabled = true;
    const { error } = await sb.auth.updateUser({ password: p1 });
    btn.disabled = false;
    if (error) { toast("Không đổi được mật khẩu: " + error.message, "err"); return; }
    await sb.auth.signOut();
    location.href = "login.html?reset=1";
  });
})();
</script>
</body>
</html>
