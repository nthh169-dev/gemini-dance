<!doctype html>
<html lang="vi">
<head>
<title>Quên mật khẩu – Gemini Dance Admin</title>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../assets/img/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-root="../" data-no-track>
<main class="login-wrap">
  <div class="form-card login-card">
    <a href="../index.html"><img src="../assets/img/logo-lockup.svg" alt="Gemini Dance"></a>
    <h1 style="font-size:1.5rem;text-align:center">Quên mật khẩu</h1>
    <p class="muted" style="text-align:center">Nhập email admin. Chúng mình sẽ gửi một link để bạn đặt mật khẩu mới.</p>
    <div id="msg"></div>
    <form id="forgot-form" style="display:grid;gap:14px">
      <div><label for="email">Email admin</label><input id="email" type="email" required autocomplete="username"></div>
      <button class="btn btn-primary" type="submit">Gửi link đặt lại mật khẩu</button>
    </form>
    <p style="text-align:center;margin-top:18px"><a href="login.html">← Quay lại đăng nhập</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(function () {
  const msg = document.getElementById("msg"), form = document.getElementById("forgot-form");
  if (!sb) { msg.innerHTML = `<div class="notice">Chưa cấu hình Supabase.</div>`; return; }
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector("button"); btn.disabled = true;
    // Link trong email sẽ mở trang reset-password.html (cùng thư mục với trang này)
    const redirectTo = new URL("reset-password.html", location.href).href;
    const { error } = await sb.auth.resetPasswordForEmail(document.getElementById("email").value.trim(), { redirectTo });
    btn.disabled = false;
    if (error) {
      const code = error.code || "", text = error.message || "";
      let why;
      if (code === "over_email_send_rate_limit" || /email rate limit/i.test(text)) {
        // Email miễn phí của Supabase chỉ gửi được vài thư mỗi giờ cho cả project
        why = "Supabase đã gửi quá số email cho phép trong 1 giờ (gói miễn phí chỉ gửi được vài email/giờ). Vui lòng thử lại sau khoảng 1 giờ.";
      } else if (code === "over_request_rate_limit" || /security purposes|after \d+ seconds/i.test(text)) {
        why = "Bạn vừa yêu cầu rồi. Vui lòng đợi khoảng 1 phút rồi thử lại.";
      } else {
        why = "Không gửi được email: " + text;
      }
      console.warn("[Gemini] resetPasswordForEmail:", error.status, code, text);
      msg.innerHTML = `<div class="notice">${esc(why)}</div>`;
      return;
    }
    // Không tiết lộ email có tồn tại hay không
    form.hidden = true;
    msg.innerHTML = `<div class="result-box">📩 Nếu email này là tài khoản admin, bạn sẽ nhận được thư <b>"Reset Your Password"</b> trong vài phút. Hãy kiểm tra cả mục Spam / Quảng cáo.</div>`;
  });
})();
</script>
</body>
</html>
